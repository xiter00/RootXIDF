name: Build RootX v6.0 Fast

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- 1. INSTALL TOOLS UTAMA UBUNTU ---
      - name: Install System Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y wget git flex bison gperf python3-pip python3-setuptools cmake ninja-build ccache libffi-dev libssl-dev dfu-util python3-venv

          # --- 2. CEK CACHE ESP-IDF DI GUDANG (Pake RESTORE) ---
      - name: Restore ESP-IDF Cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          key: esp-idf-v6.0-${{ runner.os }}-v1

      # --- 3. DOWNLOAD & INSTALL (Hanya jalan kalau Cache Kosong) ---
      - name: Clone and Install ESP-IDF
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          git clone -b v6.0 --depth 1 --recursive https://github.com/espressif/esp-idf.git ~/esp-idf
          ~/esp-idf/install.sh

      # --- 4. PAKSA SIMPAN CACHE SEKARANG JUGA! (Sebelum Compile) ---
      - name: Save ESP-IDF Cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          key: esp-idf-v6.0-${{ runner.os }}-v1

      # --- 5. PATCHING SOURCE CODE & BUILD FIRMWARE ---
      - name: Patch gdbstub Source
        run: |
          python3 -c "import os,pathlib; p=pathlib.Path(os.path.expanduser('~/esp-idf'))/'components/esp_gdbstub/src/gdbstub.c'; s=p.read_text(encoding='utf-8'); s=s.replace('#if (CONFIG_ESP_SYSTEM_GDBSTUB_RUNTIME || CONFIG_ESP_GDBSTUB_SUPPORT_TASKS)', '#if 1'); p.write_text(s, encoding='utf-8')"
      - name: Inject Groq Root CA 
        run: |
          # 1. Ambil cert chain dari Groq langsung
          echo quit | openssl s_client -connect api.groq.com:443 -showcerts 2>/dev/null \
                    | awk '/BEGIN CERTIFICATE/,/END CERTIFICATE/' \
                    | awk '/BEGIN CERT/{c++} c>=2{print}' > /tmp/groq_ca.pem
          
          # 2. Jadiin C string yang valid
          python3 - <<'EOF'
          with open("/tmp/groq_ca.pem") as f:
              lines = f.readlines()
          with open("main/managers/groq_cert.h", "w") as out:
              out.write('#pragma once\n')
              out.write('static const char GROQ_ROOT_CA[] =\n')
              for line in lines:
                  out.write(f'  "{line.rstrip()}\\n"\n')
              out.write(';\n')
          EOF
          
          # 3. Verifikasi hasilnya gak kosong
          cat main/managers/groq_cert.h
      - name: Inject Gemini Root CA
        run: |
          echo quit | openssl s_client -connect generativelanguage.googleapis.com:443 -showcerts 2>/dev/null \
                    | awk '/BEGIN CERTIFICATE/,/END CERTIFICATE/' \
                    | awk '/BEGIN CERT/{c++} c>=2{print}' > /tmp/gemini_ca.pem
          
          python3 - <<'EOF'
          with open("/tmp/gemini_ca.pem") as f:
              lines = f.readlines()
          with open("main/managers/gemini_cert.h", "w") as out:
              out.write('#pragma once\n')
              out.write('static const char GEMINI_ROOT_CA[] =\n')
              for line in lines:
                  out.write(f'  "{line.rstrip()}\\n"\n')
              out.write(';\n')
          EOF
          
          cat main/managers/gemini_cert.h
      - name: Build Firmware
        run: |
          # Load compiler & environment dari folder
          . ~/esp-idf/export.sh
          
          # Patching wifi_init
          python3 -c "import os; p=os.path.expanduser('~/esp-idf/components/esp_wifi/src/wifi_init.c'); \
          f=open(p,'r').read() if os.path.exists(p) else ''; \
          open(p,'w').write(f.replace('return ESP_ERR_WIFI_IF;', 'return ESP_OK;')) if f else print('File not found')"
          
          echo "Patch Selesai, Lanjut Build..."

          if [ -f sdkconfig.defaults ]; then
            cp sdkconfig.defaults sdkconfig
          fi
          
          idf.py fullclean
          idf.py set-target esp32s3
          idf.py add-dependency "espressif/cjson"
          idf.py build

      # --- 6. UPLOAD HASIL JADI .BIN ---
      - name: Upload Bin
        uses: actions/upload-artifact@v4
        with:
          name: RootX-v6-Firmware
          path: |
            build/*.bin
            build/*/*.bin
        
      - name: Push Firmware dan Version ke Repo 2
        env:
          TOKEN_AKSES: ${{ secrets.REPO_RTXUP }}
          REPO_RTXUP: ${{ secrets.REPO_RTXUP }}
        run: |
          # 1. Setup identitas git biar bisa commit
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # 2. Clone Repo 2 ke dalam folder sementara bernama 'repo2_dir'
          git clone https://x-access-token:$REPO_RTXUP@github.com/xiter00/RTXUP.git repo2_dir
          
          # 3. Copy file firmware.bin dan version.txt ke folder Repo 2
          # (Sesuaikan 'path/to/...' dengan lokasi asli file lu di Repo 1)
          cp build/core.bin repo2_dir/
          cp vr.txt repo2_dir/
          
          # 4. Masuk ke folder Repo 2, lalu commit dan push
          cd repo2_dir
          
          # Kita pakai 'git add .' aja biar semua file baru/berubah otomatis kelacak
          git add .
          
          # Menggunakan nomor run build biar pesan commit-nya dinamis
          git commit -m "Update firmware & version otomatis (Build #${{ github.run_number }})"
          
          # Push kembali ke branch utama (main/master)
          git push origin main
